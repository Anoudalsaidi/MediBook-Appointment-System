<div class="darkmode">
<div class="container my-5">

  <h2 class="underline-title">My Appointments</h2>

  
  <p *ngIf="appointments.length === 0" class="text-center text-muted">
    No appointments yet.
  </p>


  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let app of appointments; let i = index">

      <div class="card p-3 shadow-sm">

        <h5>{{ app.doctor }}</h5>
        <p class="text-muted">{{ app.specialty }}</p>

        <p><strong>Day:</strong> {{ app.date }}</p>
        <p><strong>Time:</strong> {{ app.time }}</p>

        <button 
          class="btn btn-danger btn-sm mt-2"
          (click)="deleteAppointment(i)">
          Cancel Appointment
        </button>

      </div>

    </div>
  </div>

</div></div>
