        <div class="contactpage">
   <section id="contact" class="container my-5">
  <h2 class="section-title text-center mb-5">Contact Us</h2>

  <div class="row align-items-start g-4">

    <!-- ===== Clinic Info ===== -->
    <div class="col-lg-5 col-md-12">
      <div class="contact-info p-4 rounded-3 shadow-sm h-100">
        <h4 class="mb-4 text-primary">📍 Clinic Information</h4>
        <p id="contactAddress" class="mb-2 fw-semibold"></p>
        <p id="contactPhone" class="mb-2 fw-semibold"></p>
        <p id="contactEmail" class="mb-2 fw-semibold"></p>
        <p id="contactHours" class="mb-2 fw-semibold"></p>
      </div>
    </div>

    <!-- ===== Contact Form ===== -->
    <div class="col-lg-7 col-md-12">
      <form id="contactForm" class="contact-form p-4 rounded-3 shadow-sm">
        <h4 class="mb-4 text-primary">Send Us a Message</h4>
        <div class="mb-3">
          <input type="text" id="name" class="form-control form-control-lg" placeholder="Your Name" required>
        </div>
        <div class="mb-3">
          <input type="email" id="emailForm" class="form-control form-control-lg" placeholder="Your Email" required>
        </div>
        <div class="mb-3">
          <textarea id="message" class="form-control form-control-lg" rows="4" placeholder="Your Message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">Send Message</button>
      </form>
    </div>

  </div>
</section></div>



<script src="./JS/bootstrap.bundle.min.js"></script>
